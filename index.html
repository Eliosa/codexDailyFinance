<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全球财经观察</title><style>body{margin:0;background:#f6f7f9;color:#17243a;font:16px/1.8 system-ui}header{background:#102238;color:white;padding:30px 6%}main{max-width:1100px;margin:40px auto;padding:0 24px}h1{margin:0;font-size:30px}nav{display:flex;gap:12px;margin:24px 0;flex-wrap:wrap}button,input,a.btn{font:inherit;padding:9px 16px;border:1px solid #d5dce5;border-radius:8px;background:white;color:#17243a;cursor:pointer}article,details{background:white;padding:24px;border:1px solid #e0e5eb;border-radius:12px;margin:16px 0}small{color:#62718a}.badge{background:#fff2d1;color:#885c00;padding:4px 10px;border-radius:5px}a{color:#2167a7}pre{white-space:pre-wrap;font:inherit}footer{color:#62718a;margin:30px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap}</style><header><small style="color:#a4bdcf">GLOBAL MARKET OBSERVER</small><h1>全球财经观察</h1><div>有据可查 · 历史留存 · 每日阅读</div></header><main><nav><button data-view="daily">日报</button><button data-view="weekly">周报</button><button data-view="history">历史归档</button></nav><div class="toolbar"><input id="q" placeholder="搜索标题和正文" aria-label="关键词"><input id="date" type="date" aria-label="日期"><a class="btn" href="content/manifest.json" download>下载索引</a></div><p id="status">正在读取报告…</p><section id="list"></section><footer>报告由独立任务生成。本站负责读取、归档与下载，不执行新闻抓取或模型调用。缺失报告不会用模拟内容补齐。</footer></main><script>
let rows=[],view='daily';const list=document.querySelector('#list'),status=document.querySelector('#status');function el(t,s){const n=document.createElement(t);n.textContent=s;return n}function card(r){const a=el('article','');a.append(el('small',r.date+' · '+(r.type==='daily'?'日报':'周报')+' · '+r.timezone));a.append(el('h2',r.title));const badge=el('span',r.status==='partial'?'不完整':'完整');badge.className='badge';a.append(badge);const d=el('details','');d.append(el('summary','阅读报告'));d.append(el('pre',r.body));a.append(d);const link=el('a','下载原始 Markdown');link.href=r.path;link.download=r.path.split('/').pop();a.append(link);a.append(el('p','生成时间：'+r.generated_at));a.append(el('small','SHA-256：'+r.sha256));return a}function render(){const q=document.querySelector('#q').value.toLowerCase(),date=document.querySelector('#date').value;const filtered=rows.filter(r=>(view==='history'||r.type===view)&&(!date||r.date===date)&&(!q||(r.title+r.body).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));list.replaceChildren();status.textContent=filtered.length+' 份报告'+(filtered.length?'':' · 暂无匹配内容');if(view==='history'){const groups={};for(const r of filtered)(groups[r.date.slice(0,7)]??=[]).push(r);for(const [month,items]of Object.entries(groups)){const d=el('details','');d.open=month===new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'}).slice(0,7);d.append(el('summary',month+' · '+items.length+' 份'));items.forEach(r=>d.append(card(r)));list.append(d)}}else filtered.forEach(r=>list.append(card(r)))}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('input').forEach(i=>i.oninput=render);fetch('reports.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(r=>{rows=r;render()}).catch(()=>status.textContent='报告读取失败，请稍后重试。');</script></html>
